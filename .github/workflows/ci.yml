# CI for every pull request to main and every push to main (TDR-012).
# The job names below are the required status checks on main.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make tidy-check fmt-check vet
      - run: make tool-sqlc sqlc-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make up
      # The full end-to-end suite (T020): top-up, P2P, withdrawal, webhooks, ledger checks.
      - run: make e2e
        timeout-minutes: 5
      - if: failure()
        run: docker compose logs
      - if: always()
        run: make down

  # Web app (TDR-019 §4): generated API types, lint, type check, unit/component tests, build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: make web-ci

  # Browser tests of the web app against the compose stack.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make up
      - run: make web-install
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make web-e2e
        timeout-minutes: 10
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs
      - if: always()
        run: make down
