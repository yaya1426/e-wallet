# golangci-lint v2 configuration (version pinned in the Makefile and CI).
version: "2"

run:
  build-tags:
    - integration
    - e2e

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # internal/platform holds shared technical building blocks and must not depend on
        # business modules (TDR-001, architecture §3.2).
        platform-no-business:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: platform must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: platform must not import business modules
        # ledger depends on nothing in business modules (architecture §3.2).
        ledger-no-business:
          files:
            - "**/internal/ledger/**"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: ledger must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: ledger must not import business modules
        # identity → wallet → ledger (architecture §3.2). identity reaches wallet only through
        # its WalletOpener interface, so it imports no business module at all.
        identity-deps:
          files:
            - "**/internal/identity/**"
            - "!$test" # integration tests wire the real modules together
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: identity must not import business modules (it uses the WalletOpener interface)
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: identity must not import business modules (it uses the WalletOpener interface)
        # wallet may import ledger only.
        wallet-deps:
          files:
            - "**/internal/wallet/**"
            - "!$test" # integration tests wire the real modules together
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: wallet may import only ledger among business modules
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: wallet may import only ledger among business modules
        # transaction imports only platform packages (T006).
        transaction-deps:
          files:
            - "**/internal/transaction/**"
            - "!$test"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: transaction must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: transaction must not import business modules
        # idempotency imports only platform packages (T007).
        idempotency-deps:
          files:
            - "**/internal/idempotency/**"
            - "!$test"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: idempotency must not import business modules
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: idempotency must not import business modules
        # outbox is a platform-style module: it imports only internal/platform (T012).
        outbox-deps:
          files:
            - "**/internal/outbox/**"
            - "!$test"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: outbox imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: outbox imports only internal/platform
        # bank (the port and its adapters) imports only internal/platform (T013).
        bank-deps:
          files:
            - "**/internal/bank/**"
            - "!$test"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/identity
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/wallet
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/ledger
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/transaction
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/transfer
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/idempotency
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: bank imports only internal/platform
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: bank imports only internal/platform
        # transfer orchestrates wallet, transaction, ledger, identity and idempotency (T008).
        transfer-deps:
          files:
            - "**/internal/transfer/**"
            - "!$test"
          deny:
            - pkg: github.com/yaya1426/e-wallet/internal/payment
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/outbox
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/webhook
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/reconciliation
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/discrepancy
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/bank
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
            - pkg: github.com/yaya1426/e-wallet/internal/banksim
              desc: transfer may import only wallet, transaction, ledger, identity, idempotency
    forbidigo:
      forbid:
        # Money is int64 piasters; floats are forbidden in money code (TDR-003).
        # Scoped to the money packages by the exclusion rule below.
        - pattern: ^float(32|64)$
          msg: money is int64 piasters; floats are forbidden here (TDR-003)
        - pattern: ^strconv\.ParseFloat$
          msg: money is int64 piasters; floats are forbidden here (TDR-003)
      analyze-types: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: increment-decrement
        - name: range
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unused-parameter
        - name: blank-imports
  exclusions:
    # sqlc output is generated code (TDR-012); its source is each module's queries.sql.
    paths:
      - internal/.*/internal/sqlcgen/
    rules:
      - linters: [forbidigo]
        path-except: internal/(ledger|wallet|payment|transfer|platform/money)/
      - linters: [gosec]
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yaya1426/e-wallet
