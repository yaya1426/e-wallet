                $ref: '#/components/schemas/WalletStatus'
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`WALLET_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /internal/v1/wallets/{wallet_id}/unfreeze:
    post:
      tags: [internal]
      operationId: unfreezeWallet
      summary: Unfreeze a wallet. Idempotent.
      security:
        - internalKey: []
      parameters:
        - {name: wallet_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The wallet's new status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletStatus'
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`WALLET_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /internal/v1/users/{phone}/password-reset-code:
    post:
      tags: [internal]
      operationId: issuePasswordResetCode
      summary: Issue a one-time password reset code for a user (give it to them out of band)
      description: Valid 15 minutes; issuing a new code invalidates the user's earlier unused codes (TDR-018 §4).
      security:
        - internalKey: []
      parameters:
        - {name: phone, in: path, required: true, description: 'E.164, URL-escaped (+ as %2B).', schema: {type: string}}
      responses:
        '201':
          description: The code.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [phone, code, expires_at]
                properties:
                  phone: {type: string}
                  code: {type: string, pattern: '^[0-9]{6}$'}
                  expires_at: {type: string, format: date-time}
        '400':
          description: '`INVALID_PHONE`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`USER_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /internal/v1/health/ops:
    get:
      tags: [internal]
      operationId: opsHealth
      summary: What needs an operator, in one call
      description: |
        Status: `critical` when there is an open CRITICAL discrepancy or a DEAD outbox/inbox event;
        `warning` when there is an open WARNING discrepancy, a stuck transaction (older than
        RECON_STUCK_AGE), or a reconciliation job whose last run FAILED or that has not run within
        3 intervals; else `ok` (T028).
      security:
        - internalKey: []
      responses:
        '200':
          description: The summary.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status, discrepancies, stuck, outbox, inbox, jobs]
                properties:
                  status: {type: string, enum: [ok, warning, critical]}
                  discrepancies:
                    type: object
                    properties:
                      open_critical: {type: integer}
                      open_warning: {type: integer}
                  stuck:
                    type: object
                    properties:
                      TOPUP: {type: integer}
                      WITHDRAWAL: {type: integer}
                  outbox:
                    type: object
                    properties:
                      pending: {type: integer}
                      dead: {type: integer}
                  inbox:
                    type: object
                    properties:
                      pending: {type: integer}
                      dead: {type: integer}
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [name, last_status, last_finished_at, late]
                      properties:
                        name: {type: string}
                        last_status: {type: [string, 'null'], enum: [SUCCESS, FAILED, null]}
                        last_finished_at: {type: [string, 'null'], format: date-time}
                        late: {type: boolean}
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID (any version, at most 64 characters) chosen by the client per user action (TDR-005).
      schema:
        type: string
        maxLength: 64
  securitySchemes:
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Operator key (INTERNAL_API_KEY, TDR-018 §5). Missing or wrong → 401 `UNAUTHENTICATED`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from `/v1/auth/login` (TDR-011).
  headers:
    IdempotentReplayed:
      description: '`true` when the response is a replay of the first request with the same Idempotency-Key.'
      schema:
        type: string
        enum: ['true']
    RequestID:
      description: The request ID; echoed from the request or generated (UUIDv7).
      schema:
        type: string
  responses:
    Unauthenticated:
      description: '`UNAUTHENTICATED`: missing, malformed, badly signed or expired token.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserDisabled:
      description: '`USER_DISABLED`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: '`REQUEST_TOO_LARGE`: the body is larger than 64 KB.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: '`INTERNAL_ERROR`: an unexpected server error; details are only in the server log.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TryAgain:
      description: '`TRY_AGAIN`: the request kept conflicting with others; retry it as is.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Discrepancy:
      type: object
      required: [id, kind, severity, transaction_id, details, status, created_at, resolved_at, resolution_note]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        severity: {type: string, enum: [CRITICAL, WARNING]}
        transaction_id: {type: [string, 'null'], format: uuid}
        details: {type: object, description: What the operator needs to investigate.}
        status: {type: string, enum: [OPEN, RESOLVED]}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolution_note: {type: [string, 'null']}
    WalletStatus:
      type: object
      required: [wallet_id, status]
      properties:
        wallet_id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, FROZEN]}
    BankEvent:
      type: object
      description: A bank event (TDR-007 §4). Unknown fields are ignored.
      required: [event_id, event_type]
      properties:
        event_id:
          type: string
          description: Unique per event; repeated on the bank's retries.
        event_type:
          type: string
          enum: [debit.succeeded, debit.failed, payout.succeeded, payout.failed]
        bank_reference:
          type: string
        idempotency_key:
          type: string
          format: uuid
          description: Our transaction ID, sent with the bank request.
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          const: EGP
        status:
          type: string
          enum: [SUCCEEDED, FAILED]
        failure_code:
          type: string
        failure_message:
          type: string
        occurred_at:
          type: string
          format: date-time
    Error:
      type: object
      description: Error body of every non-2xx response (TDR-013).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code (see each endpoint).
              examples: [INVALID_PHONE]
            message:
              type: string
              description: Human-readable text; may change.
            request_id:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phone, full_name, password]
      properties:
        phone:
          type: string
          description: Egyptian mobile number in E.164.
          pattern: '^\+201[0125][0-9]{8}$'
          examples: ['+201001234567']
        full_name:
          type: string
          description: 2 to 100 characters after trimming spaces.
          examples: [Ahmed Mohamed Ali]
        password:
          type: string
          format: password
          description: 8 to 72 bytes.
    RegisterResponse:
      type: object
      required: [user_id, phone, full_name, wallet_id, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        phone:
          type: string
        full_name:
          type: string
        wallet_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds until the token expires (JWT_TTL).
          examples: [900]
        refresh_token:
          type: string
          description: Opaque; send it to /v1/auth/refresh before it expires. Each refresh returns a new one and the old one stops working (TDR-018).
        refresh_expires_in:
          type: integer
          description: Seconds until the refresh token expires (REFRESH_TOKEN_TTL).
          examples: [2592000]
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Wallet:
      type: object
      required: [wallet_id, currency, available_balance_minor, status]
      properties:
        wallet_id:
          type: string
          format: uuid
        currency:
          type: string
          const: EGP
        available_balance_minor:
          type: integer
          format: int64
          minimum: 0
          description: Available balance in piasters.
        status:
          type: string
          enum: [ACTIVE, FROZEN]
    BankAccountRequest:
      type: object
      additionalProperties: false
      required: [iban, holder_name]
      properties:
        iban:
          type: string
          description: Egyptian IBAN; spaces and lower case are accepted.
          examples: ['EG89 0003 0001 0000 0000 1234 5000 0']
        holder_name:
          type: string
          description: 2 to 100 characters after trimming spaces.
          examples: [Ahmed Mohamed Ali]
    BankAccount:
      type: object
      required: [iban, holder_name, updated_at]
      properties:
        iban:
          type: string
          description: Normalized IBAN.
          pattern: '^EG[0-9]{27}$'
          examples: [EG890003000100000000123450000]
        holder_name:
          type: string
        updated_at:
          type: string
          format: date-time
    AmountRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Piasters (1 EGP = 100).
          examples: [50000]
        currency:
          type: string
          const: EGP
    AcceptedTransaction:
      type: object
      required: [transaction_id, type, status, amount_minor, currency, created_at]
      properties:
        transaction_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [TOPUP, WITHDRAWAL]
        status:
          type: string
          const: PENDING
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          const: EGP
        created_at:
          type: string
          format: date-time
    TransferRequest:
      type: object
      additionalProperties: false
      required: [recipient_phone, amount_minor, currency]
      properties:
        recipient_phone:
          type: string
          pattern: '^\+201[0125][0-9]{8}$'
          examples: ['+201001234567']
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Amount in piasters (1 EGP = 100).
          examples: [5000]
        currency:
          type: string
          const: EGP
        note:
          type: string
          description: Optional; at most 140 characters after trimming.
          examples: [lunch]
    Transfer:
      type: object
      required: [transaction_id, type, status, amount_minor, currency, recipient, note, balance_after_minor, created_at]
      properties:
        transaction_id:
          type: string
          format: uuid
        type:
          type: string
          const: P2P
        status:
          type: string
