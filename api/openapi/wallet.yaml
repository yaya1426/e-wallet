    Recipient:
      type: object
      required: [phone, masked_name]
      properties:
        phone:
          type: string
        masked_name:
          type: string
          examples: [Ahmed M. A.]
    TransactionItem:
      type: object
      required: [id, type, status, direction, amount_minor, currency, counterparty, note, failure_code, failure_message, created_at, updated_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [TOPUP, WITHDRAWAL, P2P]
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        direction:
          type: string
          enum: [IN, OUT]
          description: OUT when the caller's wallet sent the money (withdrawal, P2P sent), IN otherwise.
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          const: EGP
        counterparty:
          description: The other user of a P2P transfer; null for other types.
          oneOf:
            - $ref: '#/components/schemas/Recipient'
            - type: 'null'
        note:
          type: [string, 'null']
        failure_code:
          type: [string, 'null']
        failure_message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    TransactionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        next_cursor:
          type: [string, 'null']
