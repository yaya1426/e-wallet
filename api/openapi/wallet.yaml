openapi: 3.1.0
info:
  title: E-Wallet API
  version: 0.1.0
  summary: EGP e-wallet backend (phase 1).
  description: |
    Public JSON API of the wallet service. Conventions (TDR-013, TDR-017):
    `snake_case` fields; amounts are integer piasters in `*_minor` fields (1 EGP = 100);
    timestamps are RFC 3339 UTC; request bodies are strict JSON (unknown fields rejected,
    at most 64 KB); every response has an `X-Request-ID` header.

    This file is the catalogue of error codes (TDR-017 §3): each endpoint lists its codes.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local docker compose stack
tags:
  - name: auth
    description: Registration and login (TDR-011).
  - name: wallet
    description: The signed-in user's wallet.
  - name: webhooks
    description: Calls from the bank (TDR-007); authenticated by an HMAC signature, not a user token.
  - name: internal
    description: Operator endpoints (TDR-018 §5), header `X-Internal-Api-Key`. Not mounted when INTERNAL_API_KEY is unset.
security: []
paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a user and open their EGP wallet
      description: |
        Creates the user, their EGP wallet and its ledger account (balance 0) in one
        transaction (PRD-001 US-1, BR-5). Validation order: body → phone → password → name →
        phone uniqueness. No token is returned; call `/v1/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: |
            `MALFORMED_REQUEST` (bad JSON, unknown field, wrong type, trailing data),
            `INVALID_PHONE`, `INVALID_PASSWORD`, `INVALID_NAME`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`PHONE_ALREADY_REGISTERED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          description: '`TOO_MANY_REQUESTS`: too many registrations from this client IP this hour (REGISTER_LIMIT_PER_HOUR, TDR-018).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/TryAgain'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and get an access token
      description: |
        Unknown phone and wrong password get the same answer. Every attempt counts towards
        the limits: 10 per phone and 30 per client IP per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '`MALFORMED_REQUEST`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`INVALID_CREDENTIALS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          description: '`TOO_MANY_REQUESTS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a new access token and refresh token
      description: |
        Rotation (TDR-018 §3): the refresh token is single use; the answer carries a new one,
        valid 30 days from now. Presenting a token that was already used signs the whole
        session out (possible theft).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new session (same shape as the login response).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '`MALFORMED_REQUEST`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`INVALID_REFRESH_TOKEN`: unknown, expired, already used or revoked; log in again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`USER_DISABLED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session of a refresh token
      description: Always 204 for a signed-in caller; an unknown token or another user's token changes nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out (or nothing to do).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          description: '`MALFORMED_REQUEST`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a one-time code from an operator
      description: |
        Operator-assisted reset (TDR-018 §4): the code (6 digits, 15 minutes, at most 5 wrong
        attempts) comes from `POST /internal/v1/users/{phone}/password-reset-code`. Success signs
        the user out of every session (refresh tokens revoked). Shares the login rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code, new_password]
              properties:
                phone: {type: string, examples: ['+201001234567']}
                code: {type: string, pattern: '^[0-9]{6}$'}
                new_password: {type: string, format: password, description: 8 to 72 bytes.}
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          description: '`MALFORMED_REQUEST`, `INVALID_PASSWORD`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`INVALID_RESET_CODE`: unknown phone, or the code is wrong, expired, used or dead after 5 wrong attempts.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          description: '`TOO_MANY_REQUESTS`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/me/wallet:
    get:
      tags: [wallet]
      operationId: getMyWallet
      summary: Get the signed-in user's wallet
      description: |
        `available_balance_minor` is the cached ledger balance (TDR-004 §5). Money reserved for
        an in-flight withdrawal is already excluded (PRD-001 BR-9).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The wallet.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/me/bank-account:
    put:
      tags: [wallet]
      operationId: linkBankAccount
      summary: Link or replace the signed-in user's bank account
      description: |
        One linked account per user (PRD-001 Q4). The IBAN is normalized (spaces removed,
        upper-cased) and must be an Egyptian IBAN with a valid mod-97 check. Validation order:
        body → IBAN → holder name. Replacing keeps the link and updates `updated_at`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountRequest'
      responses:
        '200':
          description: Linked (created or replaced).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '400':
          description: '`MALFORMED_REQUEST`, `INVALID_IBAN`, `INVALID_HOLDER_NAME`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
    get:
      tags: [wallet]
      operationId: getBankAccount
      summary: Get the signed-in user's linked bank account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The linked account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '404':
          description: '`BANK_ACCOUNT_NOT_FOUND`: no account linked yet.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/transfers:
    post:
      tags: [wallet]
      operationId: sendTransfer
      summary: Send money to another user (P2P)
      description: |
        Synchronous: the transfer is either completed or rejected in one database transaction
        (PRD-004). Checks run in this order; the ones after the idempotency check (422/404/403
        business errors) are stored for the `Idempotency-Key` and replayed for a repeat.

        A replay (of a 201 or of a stored 4xx) has the header `Idempotent-Replayed: true` and
        the first response's body, including that response's `error.request_id`. It is the
        same JSON, but keys may come in a different order.

        1. token → 401 `UNAUTHENTICATED`
        2. body → 400 `MALFORMED_REQUEST`
        3. key → 400 `IDEMPOTENCY_KEY_REQUIRED` / `IDEMPOTENCY_KEY_INVALID`
        4. `amount_minor` ≤ 0 → 400 `INVALID_AMOUNT`
        5. `currency` ≠ EGP → 400 `UNSUPPORTED_CURRENCY`
        6. phone format → 400 `INVALID_PHONE`
        7. note > 140 characters → 400 `INVALID_NOTE`
        - idempotency → replay, 422 `IDEMPOTENCY_KEY_REUSED`, 409 `REQUEST_IN_PROGRESS`
        8. amount outside the P2P range → 422 `AMOUNT_OUT_OF_RANGE`
        9. recipient not registered → 404 `RECIPIENT_NOT_FOUND`
        10. recipient = sender → 422 `SELF_TRANSFER_NOT_ALLOWED`
        11. sender wallet frozen → 403 `WALLET_FROZEN`
        12. balance too low → 422 `INSUFFICIENT_FUNDS`
        13. daily outgoing limit → 422 `DAILY_LIMIT_EXCEEDED`
        14. recipient balance limit → 422 `RECIPIENT_LIMIT_EXCEEDED`
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: 'Transfer completed (or the replay of a completed one, with `Idempotent-Replayed: true`).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: '`MALFORMED_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`, `INVALID_AMOUNT`, `UNSUPPORTED_CURRENCY`, `INVALID_PHONE`, `INVALID_NOTE`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`WALLET_FROZEN` (sender), `USER_DISABLED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`RECIPIENT_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`REQUEST_IN_PROGRESS`: a request with this key is still running.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`, `AMOUNT_OUT_OF_RANGE`, `SELF_TRANSFER_NOT_ALLOWED`, `INSUFFICIENT_FUNDS`, `DAILY_LIMIT_EXCEEDED`, `RECIPIENT_LIMIT_EXCEEDED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/TryAgain'
  /v1/topups:
    post:
      tags: [wallet]
      operationId: requestTopUp
      summary: Top up the wallet from the linked bank account
      description: |
        Asynchronous (PRD-002): `202` means the top-up is accepted as `PENDING`; the bank is
        asked to pull the money right after, and the wallet is credited only when the bank
        confirms. Follow it with `GET /v1/transactions/{id}` until `COMPLETED` or `FAILED`
        (then with the bank's `failure_code`, e.g. `INSUFFICIENT_FUNDS`, `INVALID_ACCOUNT`).
        Checks run in this order; the ones after the idempotency check are stored for the
        `Idempotency-Key` and replayed for a repeat (`Idempotent-Replayed: true`).

        1. token → 401 `UNAUTHENTICATED`
        2. body → 400 `MALFORMED_REQUEST`
        3. key → 400 `IDEMPOTENCY_KEY_REQUIRED` / `IDEMPOTENCY_KEY_INVALID`
        4. `amount_minor` ≤ 0 → 400 `INVALID_AMOUNT`
        5. `currency` ≠ EGP → 400 `UNSUPPORTED_CURRENCY`
        - idempotency → replay, 422 `IDEMPOTENCY_KEY_REUSED`, 409 `REQUEST_IN_PROGRESS`
        6. wallet frozen → 403 `WALLET_FROZEN`
        7. no linked bank account → 422 `BANK_ACCOUNT_REQUIRED`
        8. amount outside the top-up range → 422 `AMOUNT_OUT_OF_RANGE`
        9. balance + pending top-ups + amount above the maximum balance → 422 `WALLET_LIMIT_EXCEEDED`
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '202':
          description: 'Top-up accepted, `PENDING` (or the replay of an accepted one, with `Idempotent-Replayed: true`).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedTransaction'
        '400':
          description: '`MALFORMED_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`, `INVALID_AMOUNT`, `UNSUPPORTED_CURRENCY`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`WALLET_FROZEN`, `USER_DISABLED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`REQUEST_IN_PROGRESS`: a request with this key is still running.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`, `BANK_ACCOUNT_REQUIRED`, `AMOUNT_OUT_OF_RANGE`, `WALLET_LIMIT_EXCEEDED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/TryAgain'
  /v1/withdrawals:
    post:
      tags: [wallet]
      operationId: requestWithdrawal
      summary: Withdraw money to the linked bank account
      description: |
        Asynchronous (PRD-003): `202` means the withdrawal is accepted as `PENDING` and the
        amount is reserved at once (the available balance drops). The bank is asked to pay out
        right after; follow it with `GET /v1/transactions/{id}` until `COMPLETED`, or `FAILED`
        with the bank's `failure_code` (e.g. `INVALID_ACCOUNT`), in which case the amount is
        returned to the wallet. Checks run in this order; the ones after the idempotency check
        are stored for the `Idempotency-Key` and replayed for a repeat.

        1. token → 401 `UNAUTHENTICATED`
        2. body → 400 `MALFORMED_REQUEST`
        3. key → 400 `IDEMPOTENCY_KEY_REQUIRED` / `IDEMPOTENCY_KEY_INVALID`
        4. `amount_minor` ≤ 0 → 400 `INVALID_AMOUNT`
        5. `currency` ≠ EGP → 400 `UNSUPPORTED_CURRENCY`
        - idempotency → replay, 422 `IDEMPOTENCY_KEY_REUSED`, 409 `REQUEST_IN_PROGRESS`
        6. wallet frozen → 403 `WALLET_FROZEN`
        7. no linked bank account → 422 `BANK_ACCOUNT_REQUIRED`
        8. amount outside the withdrawal range → 422 `AMOUNT_OUT_OF_RANGE`
        9. available balance below the amount → 422 `INSUFFICIENT_FUNDS`
        10. today's withdrawals + P2P sent + amount above the daily limit (Africa/Cairo day) → 422 `DAILY_LIMIT_EXCEEDED`
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '202':
          description: 'Withdrawal accepted, `PENDING`, amount reserved (or the replay of an accepted one, with `Idempotent-Replayed: true`).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedTransaction'
        '400':
          description: '`MALFORMED_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_INVALID`, `INVALID_AMOUNT`, `UNSUPPORTED_CURRENCY`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`WALLET_FROZEN`, `USER_DISABLED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`REQUEST_IN_PROGRESS`: a request with this key is still running.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`, `BANK_ACCOUNT_REQUIRED`, `AMOUNT_OUT_OF_RANGE`, `INSUFFICIENT_FUNDS`, `DAILY_LIMIT_EXCEEDED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/TryAgain'
  /v1/recipients:
    get:
      tags: [wallet]
      operationId: previewRecipient
      summary: Confirm who a phone number belongs to before sending money
      description: |
        Returns the masked name only (PRD-004 P2P-BR-5, Q7), e.g. "Ahmed M. A.". Encode the `+`
        as `%2B` in the query string; an unescaped `+` becomes a space and is rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            pattern: '^\+201[0125][0-9]{8}$'
            examples: ['+201001234567']
      responses:
        '200':
          description: The recipient.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          description: '`INVALID_PHONE`: missing or not an Egyptian mobile number in E.164.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '404':
          description: '`RECIPIENT_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`SELF_TRANSFER_NOT_ALLOWED`: the phone is your own.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/me/transactions:
    get:
      tags: [wallet]
      operationId: listMyTransactions
      summary: List the signed-in user's transactions, newest first
      description: |
        Cursor pagination (TDR-013): pass `next_cursor` from the previous page as `cursor`;
        it is `null` on the last page. A P2P transfer appears for both users, each with their
        own `direction` and the other user as `counterparty`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          description: '`INVALID_LIMIT` (not an integer from 1 to 100), `INVALID_CURSOR`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '500':
          $ref: '#/components/responses/Internal'
  /v1/transactions/{id}:
    get:
      tags: [wallet]
      operationId: getTransaction
      summary: Get one of the signed-in user's transactions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The transaction, from the caller's point of view.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UserDisabled'
        '404':
          description: '`TRANSACTION_NOT_FOUND`: not a UUID, unknown, or not one of the caller''s transactions.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /webhooks/bank:
    post:
      tags: [webhooks]
      operationId: receiveBankWebhook
      summary: Receive a bank event (debit/payout succeeded or failed)
      description: |
        Called by the bank, not by apps (TDR-007). The header `X-Bank-Signature:
        t=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + raw body)>` must verify and `t`
        must be within 5 minutes of the server time; several `v1` values may be sent. The event
        is stored once per `event_id` and processed asynchronously: `200` means stored (or
        already stored), not applied. Only `event_id` and `event_type` are checked here.
      parameters:
        - name: X-Bank-Signature
          in: header
          required: true
          schema:
            type: string
          example: t=1762682400,v1=b6625751ed23392018d345cd665e5ef0b4664c0660f71789ed110eaafe0e3bb8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankEvent'
      responses:
        '200':
          description: Stored, or a duplicate of a stored event.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '400':
          description: '`MALFORMED_REQUEST`: not a JSON object, or `event_id` / `event_type` missing.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`INVALID_SIGNATURE`: the header is missing or malformed, no signature matches, or `t` is more than 5 minutes away.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '503':
          description: '`TRY_AGAIN`: the event could not be stored; the bank retries.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/discrepancies:
    get:
      tags: [internal]
      operationId: listDiscrepancies
      summary: List discrepancies for an operator, newest first
      security:
        - internalKey: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, RESOLVED]}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [STATUS_MISMATCH, AMOUNT_MISMATCH, UNMATCHED_BANK_MOVEMENT, UNMATCHED_LEDGER_MOVEMENT, STUCK_TRANSACTION, UNKNOWN_BANK_EVENT, LEDGER_INTEGRITY]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: One page; `next_cursor` is null on the last page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discrepancy'
                  next_cursor:
                    type: [string, 'null']
        '400':
          description: '`INVALID_FILTER` (status/kind), `INVALID_LIMIT`, `INVALID_CURSOR`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /internal/v1/discrepancies/{id}/resolve:
    post:
      tags: [internal]
      operationId: resolveDiscrepancy
      summary: Close an open discrepancy with a note (never changes money)
      security:
        - internalKey: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note:
                  type: string
                  description: 1 to 500 characters after trimming.
      responses:
        '200':
          description: The resolved discrepancy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discrepancy'
        '400':
          description: '`MALFORMED_REQUEST`, `INVALID_NOTE`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`UNAUTHENTICATED`: missing or wrong `X-Internal-Api-Key`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`DISCREPANCY_NOT_FOUND`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`ALREADY_RESOLVED`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /internal/v1/wallets/{wallet_id}/freeze:
    post:
      tags: [internal]
      operationId: freezeWallet
